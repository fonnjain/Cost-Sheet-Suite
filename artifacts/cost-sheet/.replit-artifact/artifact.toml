kind = "web"
previewPath = "/"
title = "Vijay Transmission Cost Sheet Suite"
version = "1.0.0"
id = "artifacts/cost-sheet"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21194

[services.development]
run = "pnpm --filter @workspace/cost-sheet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cost-sheet", "run", "build" ]
publicDir = "artifacts/cost-sheet/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21194"
BASE_PATH = "/"
